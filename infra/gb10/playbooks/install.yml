---
- name: Install GB10 user tooling
  hosts: gb10
  gather_facts: true

  vars:
    user_home: "{{ ansible_facts.env.HOME }}"
    local_bin: "{{ user_home }}/.local/bin"
    uv_bin: "{{ local_bin }}/uv"
    openshell_package: openshell
    openshell_command: openshell
    openshell_bin: "{{ local_bin }}/{{ openshell_command }}"

  tasks:
    - name: Check curl availability
      ansible.builtin.shell:
        cmd: command -v curl
      register: curl_check
      changed_when: false
      failed_when: false

    - name: Ensure curl is present on Debian/Ubuntu hosts
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      become: true
      when:
        - ansible_facts.os_family == "Debian"
        - curl_check.rc != 0

    - name: Ensure curl is present on RedHat-family hosts
      ansible.builtin.dnf:
        name:
          - ca-certificates
          - curl
        state: present
      become: true
      when:
        - ansible_facts.os_family == "RedHat"
        - curl_check.rc != 0

    - name: Ensure local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: "0755"

    - name: Check uv installation
      ansible.builtin.stat:
        path: "{{ uv_bin }}"
      register: uv_stat

    - name: Install uv
      ansible.builtin.shell: |
        set -eu
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        executable: /bin/sh
      when: not uv_stat.stat.exists

    - name: Ensure local bin is on shell PATH
      ansible.builtin.blockinfile:
        path: "{{ user_home }}/.profile"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: local bin path"
        block: |
          if [ -d "$HOME/.local/bin" ]; then
            export PATH="$HOME/.local/bin:$PATH"
          fi

    - name: Check openshell installation
      ansible.builtin.stat:
        path: "{{ openshell_bin }}"
      register: openshell_stat

    - name: Install openshell with uv
      ansible.builtin.command:
        cmd: "{{ uv_bin }} tool install {{ openshell_package }}"
      when: not openshell_stat.stat.exists

    - name: Check openshell after install
      ansible.builtin.stat:
        path: "{{ openshell_bin }}"
      register: openshell_installed

    - name: Verify uv is available
      ansible.builtin.command:
        cmd: "{{ uv_bin }} --version"
      changed_when: false

    - name: Verify openshell is installed
      ansible.builtin.assert:
        that:
          - openshell_installed.stat.exists
          - openshell_installed.stat.executable
        fail_msg: "{{ openshell_package }} installed, but {{ openshell_bin }} was not found or is not executable. Override openshell_command if the package exposes a different binary name."

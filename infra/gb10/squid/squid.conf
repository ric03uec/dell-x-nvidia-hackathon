# Squid as an egress *observatory*, not a cache and not a MITM.
#
# What this gives you per request:
#   plain HTTP  -> full URL, method, bytes, status
#   HTTPS       -> CONNECT host:443 only. Domain + bytes + timing, no paths.
#
# That is deliberate. The OpenShell egress records this feeds
# (libs/skills/openshell-egress-audit) key on host:port — `api.mixpanel.com:443`
# — so domain granularity is already the right unit. Decrypting to get paths
# means SSL-bump: a CA cert on every client, broken cert-pinned apps, and
# reading colleagues' traffic. See README before going there.

http_port 3128

visible_hostname gb10-squid

# --- who may use the proxy ---------------------------------------------
# All three RFC1918 ranges: the box sits on 192.168.0.0/24 (ethernet) and
# 172.16.0.0/16 (wifi), and laptops have been seen on 10.0.0.0/8.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

# --- logging -----------------------------------------------------------
# The exfilguard format, from section 4.2 of the architecture doc. key=value so
# the collector parses by name rather than position — fields can be added later
# without breaking it.
#
# req_bytes is the exfiltration signal: bytes FROM the client. The earlier
# interim format here logged only resp_bytes and was blind to upload volume.
#
# dst_ip is an addition, not in the doc's §4.2 — proposed against dxnvh-332.2
# before the contracts freeze. It is the only handle on destinations that are
# raw IPs, and it lets a CONNECT hostname be correlated with where the
# connection actually landed. Cheap to drop, expensive to add later.
#
# For CONNECT, uri is exactly `host:port`.
#
# BYTE ACCOUNTING, MEASURED ON THIS BOX 2026-07-26 (squid 6.6, aarch64), with a
# known 100,000-byte POST body:
#   plain HTTP    req_bytes=100200   (+200, request headers)
#   HTTPS CONNECT req_bytes=101326   (+1326, TLS record + handshake overhead)
# req_bytes IS populated and trustworthy for CONNECT tunnels. Upload-volume
# detection therefore does NOT require TLS interception — treat the values as
# accurate to about 1.5% and never as exact payload size.
# resp_bytes on an aborted request reads 0 with result=TCP_MISS_ABORTED; do not
# read that as "nothing was uploaded" — req_bytes was a full 100200 on exactly
# such a line.
logformat exfilguard ts=%ts.%03tu src=%>a user=%un method=%rm uri=%ru status=%>Hs req_bytes=%>st resp_bytes=%<st mime=%mt result=%Ss dst_ip=%<a
access_log /var/log/squid/access.log exfilguard

# Cuts demo latency; revisit for production throughput.
buffered_logs off

# NOT /dev/stdout, however tempting. Squid runs as uid 13 (proxy) in this image
# and cannot fopen /dev/stdout or /dev/stderr by path. It then dies at startup
# showing only "Creating missing swap directories" — which reads like a cache
# problem and is not one. Verified on the box; don't re-litigate it.
# Read the feed with:
#   docker exec hack-squid tail -f /var/log/squid/access.log

# --- not a cache -------------------------------------------------------
# Visibility only. Caching would hide repeat egress, which is the opposite of
# what this box is for.
cache deny all

shutdown_lifetime 5 seconds

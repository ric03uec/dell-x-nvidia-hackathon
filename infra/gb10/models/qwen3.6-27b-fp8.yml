slug: qwen3.6-27b-fp8
hf_model: Qwen/Qwen3.6-27B-FP8
image: vllm-inx:26.06-py3-patched
port: 8009
gpu_memory_utilization: 0.85
max_model_len: 262144
max_num_seqs: 3
dtype: auto
extra_args:
  - --enable-prefix-caching
  - --enforce-eager
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_xml
  - --reasoning-parser
  - qwen3
  - --speculative-config
  - '{"method":"mtp","num_speculative_tokens":2}'
vram_estimate_gib: 95
mandatory: false
virtual_models:
  - name: Qwen3.6-27B
    chat_template_kwargs:
      enable_thinking: true
  - name: qwen3.6-27b
    chat_template_kwargs:
      enable_thinking: true
  - name: Qwen3.6-27B-FP8
    chat_template_kwargs:
      enable_thinking: true
notes: |
  Qwen3.6-27B dense at FP8 — sole active model on hack for the rollout
  in issue #18. Native 262144 context (256K) — hard user requirement.

  Phase 2 (baseline serve): NO tool-call-parser, NO reasoning-parser,
  NO MTP. Prove the model comes up at full context first; each
  subsequent phase adds one variable.

  Phases 3–5 will append (in order):
    --enable-auto-tool-choice --tool-call-parser hermes    (phase 3)
    --reasoning-parser qwen3                                (phase 4)
    --speculative-config '{"method":"mtp",...}'             (phase 5, TBD)

  Sizing: gpu_memory_utilization: 0.85 on the ~119.67 GiB GB10 pool
  allocates ~101.7 GiB. Post-warmup vLLM reports 67.15 GiB available KV
  cache = 997,689 tokens, i.e. 3.81x max concurrency at 262,144 ctx.
  max_num_seqs: 3 sits under that ceiling with ~5% headroom; a 4th
  full-context seq would trigger preemption/recompute rather than OOM.

  CANNOT coexist with gemma-4-diffusion or qwen3-next-80b-a3b-* at
  this context length. Sole occupant of the box for the rollout.

  Sources:
  - https://huggingface.co/Qwen/Qwen3.6-27B-FP8
  - https://recipes.vllm.ai/Qwen/Qwen3.6-27B

services:
  vllm-qwen3.6-27b-fp8:
    profiles: ["qwen36"]
    container_name: vllm-qwen3.6-27b-fp8
    image: vllm-inx:26.06-py3-patched
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /home/dell/vllm/hf-cache:/root/.cache/huggingface
      - /home/dell/vllm/chat-templates:/chat-templates:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "vllm"
      - "serve"
      - "Qwen/Qwen3.6-27B-FP8"
      - --host
      - "0.0.0.0"
      - --gpu-memory-utilization
      - "0.85"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "3"
      - --dtype
      - "auto"
      - --enable-prefix-caching
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'

  vllm-qwen3-next-80b-a3b-thinking-fp8:
    profiles: ["qwen-next-thinking"]
    container_name: vllm-qwen3-next-80b-a3b-thinking-fp8
    image: nvcr.io/nvidia/vllm:25.11-py3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /home/dell/vllm/hf-cache:/root/.cache/huggingface
      - /home/dell/vllm/chat-templates:/chat-templates:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "vllm"
      - "serve"
      - "Qwen/Qwen3-Next-80B-A3B-Thinking-FP8"
      - --host
      - "0.0.0.0"
      - --gpu-memory-utilization
      - "0.80"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "2"
      - --dtype
      - "auto"
      - --reasoning-parser
      - deepseek_r1
      - --enable-prefix-caching

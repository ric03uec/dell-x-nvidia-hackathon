  <body>
    <script>
      // Runs before paint so a stored light theme does not flash dark first.
      try {
        var t = localStorage.getItem("squidward-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

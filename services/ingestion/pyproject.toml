[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestion API scaffold (component 2). Scaffold only - schema, adapters, and the real API surface land in epic 2."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint/type/test config lives at the workspace root (../../pyproject.toml) so
# every member shares one set of rules — do not redeclare [tool.ruff],
# [tool.mypy] or [tool.pytest.ini_options] here.

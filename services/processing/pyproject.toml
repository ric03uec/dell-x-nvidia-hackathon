[project]
name = "squidward-processing"
version = "0.1.0"
description = "Local-only feature extraction, anomaly detection, and incident investigation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.3",
    "scikit-learn>=1.5,<1.8",
    # app.py serves FastAPI and Dockerfile.processing's CMD runs uvicorn, so
    # both are runtime deps, not dev ones. Without them the built image starts
    # and immediately dies with "No module named uvicorn".
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
offline = ["torch>=2.5"]

[project.scripts]
squidward-process = "processing.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing"]

[project]
name = "agentkit"
version = "0.1.0"
description = "Shared FastAPI service factory and NemoClaw/OpenShell manifest validation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.scripts]
agentkit-validate = "agentkit.manifest:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint/type/test config lives at the workspace root (../../pyproject.toml) so
# every member shares one set of rules — do not redeclare [tool.ruff],
# [tool.mypy] or [tool.pytest.ini_options] here.
